<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영도할매의 부탁 - 웹 방탈출</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: linear-gradient(180deg, 
 0%, 
 100%);
      font-family: 'Noto Sans KR', sans-serif;
    }
    .clue-badge {
      animation: glow 2s ease-in-out infinite;
    }
    @keyframes glow {
      0%, 100% { box-shadow: 0 0 10px 
; }
      50% { box-shadow: 0 0 20px 
, 0 0 30px 
; }
    }
    .story-image {
      width: 100%;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
  </style>
</head>
<body class="min-h-screen text-white p-4">
  <div class="max-w-2xl mx-auto">
    <!-- 상단 진행 상황 -->
    <div class="mb-6 text-center">
      <div id="progress" class="text-amber-400 font-bold text-lg mb-4"></div>
    </div>

    <!-- 메인 콘텐츠 -->
    <div id="content" class="mb-6"></div>

    <!-- 하단 인벤토리 -->
    <div class="bg-gray-900/50 backdrop-blur-sm rounded-lg p-4 border border-amber-600/30">
      <div class="text-xs text-amber-400 mb-2">획득한 단서</div>
      <div id="inventory" class="flex gap-2 flex-wrap min-h-[60px] items-center justify-center">
        <div class="text-gray-500 text-sm">아직 획득한 단서가 없습니다</div>
      </div>
    </div>
  </div>

  <script>
    // ========== 게임 데이터 ==========
    const gameData = {
      intro: {
        image: 'prologue.jpg'
      },
      missions: [
        {
          id: 1,
          image: 'mission1.jpg',
          location: '위치: 4층 항해관 → 「바다의 길잡이」 코너',
          title: '바다의 길잡이를 찾아라',
          story: '"풍랑을 가른 자는\n옛 항해사들의 도구를 사용했단다.\n별과 나침반, 그리고 바람을 읽는 법…\n우리 조상들이 망망대해에서\n길을 찾던 비밀을 너희도 알아내야 해."',
          activity: '탐험 미션: 「바다의 길잡이」 코너의 고대 전시물 중 항해 도구를 살펴보세요.',
          questions: [
            {
              text: 'Q1. 옛날 선원들이 방향을 찾기 위해 사용한 자석 도구의 이름은 무엇일까요?',
              type: 'text',
              answer: ['나침반']
            },
            {
              text: 'Q2. 별의 높이를 재서 배의 위치를 알아내는 도구의 이름은 무엇일까요?',
              type: 'text',
              answer: ['육분의']
            },
            {
              text: 'Q3. 동서양을 이어주던 중요한 무역 길로, 도자기와 향신료를 실은 배들이 이용한 이 길의 이름은 무엇일까요?',
              type: 'text',
              answer: ['무역풍', '무역 풍']
            }
          ],
          clue: '風',
          knowledge: '나침반과 육분의는 대항해시대의 필수 항해 도구였습니다!'
        },
        {
          id: 2,
          image: 'mission2.jpg',
          location: '위치: 4층 항해관 → 「시간과 경도」 전시',
          title: '시간의 비밀을 풀어라',
          story: '"시간을 지배하는 자가\n바다를 지배한단다.\n옛날 선원들은 시간을 재서\n자신의 위치를 알아냈지.\n그 비밀을 찾아보렴."',
          activity: '탐험 미션: 「시간과 경도」 전시에서 시간 측정 도구들을 관찰하세요.',
          questions: [
            {
              text: 'Q1. 해의 그림자로 시간을 재던 고대 도구의 이름은 무엇일까요?',
              type: 'text',
              answer: ['해시계']
            },
            {
              text: 'Q2. 바다에서 정확한 시간을 재기 위해 발명된 정밀 시계의 이름은 무엇일까요?',
              type: 'text',
              answer: ['크로노미터']
            },
            {
              text: 'Q3. 지구의 세로선을 나타내며, 시간 차이로 위치를 알 수 있게 하는 선의 이름은 무엇일까요?',
              type: 'text',
              answer: ['경도']
            }
          ],
          clue: '時',
          knowledge: '크로노미터의 발명으로 바다에서 정확한 위치를 알 수 있게 되었어요!'
        },
        {
          id: 3,
          image: 'mission3.jpg',
          location: '위치: 3층 해양문화관 → 「조선의 바다」 섹션',
          title: '용기의 상징을 찾아라',
          story: '"용맹한 장군이\n바다를 지켰단다.\n그의 배와 전략은\n적들을 물리쳤지.\n그 용기를 기억하렴."',
          activity: '탐험 미션: 「조선의 바다」 섹션에서 조선 수군의 역사를 탐험하세요.',
          questions: [
            {
              text: 'Q1. 임진왜란 때 조선 수군을 이끌고 23전 23승을 거둔 장군의 이름은 무엇일까요?',
              type: 'text',
              answer: ['이순신']
            },
            {
              text: 'Q2. 철갑으로 덮인 조선의 전투 함선 이름은 무엇일까요?',
              type: 'text',
              answer: ['거북선']
            },
            {
              text: 'Q3. 이순신 장군이 왜군을 크게 무찌른 유명한 해전의 이름은 무엇일까요?',
              type: 'text',
              answer: ['한산도대첩', '한산도 대첩']
            }
          ],
          clue: '勇',
          knowledge: '이순신 장군은 23전 23승의 불패 신화를 이룬 위대한 해군 제독입니다!'
        },
        {
          id: 4,
          image: 'mission4.jpg',
          location: '위치: 4층 항해관 → 「조선의 과학」 코너',
          title: '지혜의 발명품을 찾아라',
          story: '"지혜로운 발명가가\n하늘과 땅을 관찰했단다.\n그의 도구들은\n세상을 이해하는 열쇠였지.\n그 지혜를 배우렴."',
          activity: '탐험 미션: 「조선의 과학」 코너에서 조선시대 과학 기구들을 관찰하세요.',
          questions: [
            {
              text: 'Q1. 별의 위치를 관측하던 조선시대 천문 관측 기구의 이름은 무엇일까요?',
              type: 'text',
              answer: ['혼천의']
            },
            {
              text: 'Q2. 비의 양을 재던 세계 최초의 기상 관측 기구 이름은 무엇일까요?',
              type: 'text',
              answer: ['측우기']
            },
            {
              text: 'Q3. 이 과학 기구들을 발명한 조선시대 최고의 과학자는 누구일까요?',
              type: 'text',
              answer: ['장영실']
            }
          ],
          clue: '智',
          knowledge: '장영실은 조선시대 최고의 과학자로 다양한 천문 관측 기구를 만들었어요!'
        },
        {
          id: 5,
          image: 'mission5.jpg',
          location: '위치: 2층 해양생물관 → 「바다 생물의 세계」',
          title: '인(仁)의 마음을 찾아라',
          story: '"바다 생물들은\n서로 돕고 살아간단다.\n그들의 공존을\n관찰해보렴.\n인(仁)의 마음을 배우게 될 거야."',
          activity: '탐험 미션: 「바다 생물의 세계」에서 해양 생물들의 공생 관계를 관찰하세요.',
          questions: [
            {
              text: 'Q1. 바다에서 가장 큰 포유류로, 노래로 소통하는 동물은 무엇일까요?',
              type: 'text',
              answer: ['고래']
            },
            {
              text: 'Q2. 사람을 구해주는 이야기로 유명한, 똑똑한 바다 포유류는 무엇일까요?',
              type: 'text',
              answer: ['돌고래']
            },
            {
              text: 'Q3. 투명한 몸을 가지고 있으며, 바다를 떠다니는 생물은 무엇일까요?',
              type: 'text',
              answer: ['해파리']
            }
          ],
          clue: '仁',
          knowledge: '바다 생물들은 서로 돕고 공존하며 해양 생태계를 유지합니다!'
        },
        {
          id: 6,
          image: 'mission6.jpg',
          location: '위치: 4층 항해관 → 「항로 표지」 전시',
          title: '신뢰의 등불을 찾아라',
          story: '"어둠 속에서\n빛을 밝히는 것이 있단다.\n선원들은 그 빛을 믿고\n안전하게 항구로 돌아왔지.\n그 신뢰를 찾아보렴."',
          activity: '탐험 미션: 「항로 표지」 전시에서 항해 안전 시설들을 살펴보세요.',
          questions: [
            {
              text: 'Q1. 밤에 빛을 비춰 배들에게 길을 알려주는 높은 건축물의 이름은 무엇일까요?',
              type: 'text',
              answer: ['등대']
            },
            {
              text: 'Q2. 바다에 떠 있으면서 항로를 표시하는 표지의 이름은 무엇일까요?',
              type: 'text',
              answer: ['부표', '부이']
            },
            {
              text: 'Q3. 바다의 깊이와 암초 위치를 표시한 항해용 지도의 이름은 무엇일까요?',
              type: 'text',
              answer: ['해도']
            }
          ],
          clue: '信',
          knowledge: '등대는 수백 년 동안 선박의 안전한 항해를 지켜온 바다의 파수꾼입니다!'
        },
        {
          id: 7,
          image: 'mission7.jpg',
          location: '위치: 2층 해양생물관 전체',
          title: '예(禮)의 완성 - 최종 관문',
          story: '"마지막 시험이란다.\n바다의 모든 지식을\n총동원해야 할 거야.\n예(禮)를 갖춰\n바다를 대하는 마음을 보여주렴."',
          activity: '탐험 미션: 2층 해양생물관 전체를 탐험하며 최종 문제들을 해결하세요.',
          questions: [
            {
              text: 'Q1. 가슴지느러미에 주황색 반점이 있는 가오리의 이름은 무엇일까요?',
              type: 'text',
              answer: ['오렌지숄더서전']
            },
            {
              text: 'Q2. 몸에 범무늬 같은 줄무늬가 있는 가오리의 이름은 무엇일까요?',
              type: 'text',
              answer: ['범무늬소녀가오리']
            },
            {
              text: 'Q3. 코 부분이 납작하고 넓은 가오리의 이름은 무엇일까요?',
              type: 'text',
              answer: ['플랩노즈레이']
            },
            {
              text: 'Q4. 투구게의 피가 파란색인 이유는 무엇 때문일까요? (산소를 운반하는 물질)',
              type: 'text',
              answer: ['헤모시아닌', '헤포시아닌']
            },
            {
              text: 'Q5. 4억 5천만 년 전부터 살아온 "살아있는 화석"으로 불리는 생물은 무엇일까요?',
              type: 'text',
              answer: ['투구게']
            },
            {
              text: 'Q6. 투구게가 숨을 쉬는 신체 부위는 무엇일까요?',
              type: 'text',
              answer: ['아가미']
            },
            {
              text: 'Q7. 긴 뿔 같은 돌기가 있는 플랑크톤의 이름은 무엇일까요?',
              type: 'text',
              answer: ['사파리나']
            },
            {
              text: 'Q8. 뿔 모양의 돌기가 두 개 있는 플랑크톤의 이름은 무엇일까요?',
              type: 'text',
              answer: ['세라티움 펄카', '세라티움펄카']
            },
            {
              text: 'Q9. "바다의 천사"라고 불리는 투명한 플랑크톤의 이름은 무엇일까요?',
              type: 'text',
              answer: ['클리오네']
            },
            {
              text: 'Q10. 녹색을 띠는 단세포 조류로, 건강식품으로도 사용되는 플랑크톤의 이름은 무엇일까요?',
              type: 'text',
              answer: ['클로렐라']
            },
            {
              text: 'Q11. 미래 세대도 바다를 누릴 수 있도록 환경을 보호하는 개념을 무엇이라고 할까요?',
              type: 'text',
              answer: ['지속가능성']
            }
          ],
          clue: '禮',
          knowledge: '투구게는 4억 5천만 년 전부터 지구에 살아온 살아있는 화석입니다!'
        }
      ],
      epilogue: {
        image: 'epilogue.jpg'
      }
    };

    // ========== 상태 관리 ==========
    let currentStep = 0;
    let currentMission = 0;
    let currentQuestion = 0;
    let collectedClues = [];

    // ========== 렌더링 함수 ==========
    function render() {
      const content = document.getElementById('content');
      const progress = document.getElementById('progress');
      
      // 프롤로그 (이미지만 표시)
      if (currentStep === 0) {
        progress.textContent = '프롤로그';
        content.innerHTML = `
          <div class="mb-6">
            <img src="${gameData.intro.image}" alt="프롤로그" class="story-image">
          </div>
          <button onclick="nextStep()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 rounded-lg transition">
            탐험 시작하기
          </button>
        `;
        return;
      }

      const mission = gameData.missions[currentMission];
      if (!mission) return;

      // 미션 소개 (이미지만 표시)
      if (currentStep === 1) {
        progress.textContent = `미션 ${mission.id}`;
        content.innerHTML = `
          <div class="mb-6">
            <img src="${mission.image}" alt="미션 ${mission.id}" class="story-image">
          </div>
          <button onclick="nextStep()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 rounded-lg transition">
            퀴즈 시작하기
          </button>
        `;
        return;
      }

      // 퀴즈 (기존 텍스트 방식 유지)
      const question = mission.questions[currentQuestion];
      if (question && currentStep === 2) {
        progress.textContent = `미션 ${mission.id} - 문제 ${currentQuestion + 1}/${mission.questions.length}`;
        
        content.innerHTML = `
          <div class="bg-gray-800/50 backdrop-blur-sm rounded-lg p-6 border border-amber-600/30 mb-6">
            <div class="text-gray-300 leading-relaxed mb-4">${question.text}</div>
            <input type="text" id="textAnswer" placeholder="답을 입력하세요" 
              class="w-full bg-gray-900/50 border border-amber-600/50 rounded-lg p-4 text-gray-200 text-center text-lg focus:border-amber-500 focus:outline-none placeholder-gray-500">
          </div>
          
          <button onclick="checkAnswer()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 rounded-lg transition">
            정답 확인
          </button>
        `;
        return;
      }

      // 미션 완료
      if (currentStep === 3) {
        progress.textContent = `미션 ${mission.id} 완료!`;
        content.innerHTML = `
          <div class="bg-gradient-to-br from-amber-900/30 to-gray-800/50 backdrop-blur-sm rounded-lg p-6 border-2 border-amber-500">
            <div class="text-center mb-6">
              <div class="text-6xl clue-badge inline-block">${mission.clue}</div>
              <div class="text-amber-400 font-bold mt-3">단서를 획득했습니다!</div>
            </div>
          </div>
          
          <div class="bg-gray-800/50 backdrop-blur-sm rounded-lg p-6 border border-blue-500/30 mt-6">
            <div class="text-blue-400 font-bold mb-3 flex items-center gap-2">
              <span>💡</span> 함께 알아두면 좋은 해양 지식
            </div>
            <div class="text-gray-300 text-sm leading-relaxed">${mission.knowledge}</div>
          </div>

          <button onclick="nextMission()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 rounded-lg transition mt-6">
            ${currentMission < gameData.missions.length - 1 ? '다음 미션으로' : '최종 단서 확인하기'}
          </button>
        `;
        return;
      }
    }

    // ========== 게임 로직 ==========
    function nextStep() {
      currentStep++;
      render();
    }

    function checkAnswer() {
      const mission = gameData.missions[currentMission];
      const question = mission.questions[currentQuestion];
      const userAnswer = document.getElementById('textAnswer').value.trim();

      if (!userAnswer) {
        alert('답을 입력해주세요!');
        return;
      }

      // 정답 확인
      let isCorrect = false;
      if (Array.isArray(question.answer)) {
        isCorrect = question.answer.some(ans => 
          userAnswer.toLowerCase().includes(ans.toLowerCase()) || 
          userAnswer.toLowerCase() === ans.toLowerCase()
        );
      } else {
        isCorrect = userAnswer.toLowerCase() === question.answer.toLowerCase();
      }

      if (isCorrect) {
        alert('✅ 정답입니다!');
        currentQuestion++;
        
        if (currentQuestion >= mission.questions.length) {
          collectedClues.push(mission.clue);
          updateInventory();
          currentStep = 3;
          currentQuestion = 0;
        }
        render();
      } else {
        alert('❌ 다시 생각해보세요!');
      }
    }

    function nextMission() {
      currentMission++;
      if (currentMission >= gameData.missions.length) {
        showEpilogue();
        return;
      }
      currentStep = 1;
      render();
    }

    function showEpilogue() {
      const content = document.getElementById('content');
      const progress = document.getElementById('progress');
      progress.textContent = '🎉 완료!';
      
      content.innerHTML = `
        <div class="mb-6">
          <img src="${gameData.epilogue.image}" alt="에필로그" class="story-image">
        </div>
        
        <div class="bg-gradient-to-br from-amber-900/50 to-gray-800/50 backdrop-blur-sm rounded-lg p-6 border-2 border-amber-500 mt-6">
          <h2 class="text-xl font-bold text-amber-400 mb-4 text-center">획득한 모든 단서</h2>
          <div class="flex justify-center gap-3 flex-wrap">
            ${collectedClues.map(clue => `
              <div class="clue-badge bg-amber-900/50 border-2 border-amber-500 rounded-lg px-4 py-2 text-3xl">
                ${clue}
              </div>
            `).join('')}
            <div class="clue-badge bg-red-900/50 border-2 border-red-500 rounded-lg px-4 py-2 text-3xl">
              影
            </div>
          </div>
        </div>
        
        <div class="text-center text-sm text-gray-400 mt-6">
          국립해양박물관 방문을 기념합니다 🌊
        </div>
      `;
    }

    function updateInventory() {
      const inventory = document.getElementById('inventory');
      if (collectedClues.length === 0) {
        inventory.innerHTML = '<div class="text-gray-500 text-sm">아직 획득한 단서가 없습니다</div>';
      } else {
        inventory.innerHTML = collectedClues.map(clue => `
          <div class="clue-badge bg-amber-900/50 border-2 border-amber-500 rounded-lg px-4 py-2 text-2xl">
            ${clue}
          </div>
        `).join('');
      }
    }

    // ========== 초기화 ==========
    render();
  </script>
</body>
</html>
