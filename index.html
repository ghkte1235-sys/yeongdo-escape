            { q: '이 생물의 피는 사람처럼 붉은 색이 아닐 무색에 가깝습니다. 산소를 운반하기 위해 철 대신 구리 성분이 든 00000을 가지고 있으며, 산소와 만나면 푸른색으로 변하기 때문입니다. 00000은 무엇인가요?', type: 'text', answer: ['헤모시아닌', '헤포시아닌'] },
            { q: '피 속에는 \'LAL (Limulus Amebocyte Lysate)\'이라는 성분이 들어있어, 아주 적은 양의 독소나 오염물질도 민감하게 찾아내 굳어버리는 특성이 있어 전 세계의 의약품이 안전한지 검사하는 데 결정적인 도움을 주고 있으며, 위 문제에서 말한 이 생물은?', type: 'text', answer: ['투구게'] },
            { q: '낙지의 심장은 세개 입니다. 온몸에 피를 전달하는 1개의 체심장과 000에 피를 공급하여 산소를 빠르게 받아 들이는 2개의 000 심장으로 이루어져 있습니다. 000은 무엇인가요?', type: 'text', answer: ['아가미'] },
{ q: '평상시에는 투명한 색이지만 빛이 있는 곳에서는 육각형 모양의 얇은 구아닌 결정층을 통해 빛을 반사시켜 푸른 빛을 낸다. 바다의 사파이어라고 불린다.', type: 'text', answer: ['사파리나'], image: 'sapphirina.jpg' },
            { q: '뿔말류의 한종으로, 한개의 긴 뿔과 두개의 짧은 뿔을 가지고 있다. 앞쪽 뿔은 스스로 떼어낼 수 있다.', type: 'text', answer: ['세라티움 펄카', '세라티움펄카'], image: 'ceratium.jpg' },
            { q: '\'바다의 천사\'라는 별명을 가지고 있으며, 일반적으로 북극에서 서식한다.', type: 'text', answer: ['클리오네'], image: 'clione.jpg' },
            { q: '녹조류의 한 종으로, 많은 유생생물들의 식물성 먹이로 이용되고 있다. 항산화 물질이 풍부하여 식품 및 화장품의 원료로 이용하기도 한다.', type: 'text', answer: ['클로렐라'], image: 'chlorella.jpg' },
            { q: '미디어 아트의 \'시대를 항해하다\'는 바다를 인류의 이동을 단절하는 장벽에서 길로 만들어준 해운의 시작과 미래를 나타내는 작품입니다. 인류는 바다라는 \'장벽\'을 건너 새로운 세상을 만나는 \'길\'을 개척해왔습니다. 이제 미래의 해운은 단순히 물자를 옮기는 것을 넘어, 해양 생태계를 보존하고 환경과 공존하는 \'이 가치\'를 향해 나아가고 있습니다. 설명문의 마지막 문단에 등장하는 다섯 글자의 핵심 단어는 무엇일까요?', type: 'text', answer: ['지속가능성'] },
            { q: '', type: 'text', answer: ['그림자', '영', '그림자 영'], image: 'final_mission.jpg', hint: '힌트 1: 이 박물관이 위치한 섬 이름과 관련 있어요.\n힌트 2: 빛이 있으면 생기는 거에요.' }
          ],
          clueChar: '影',
          clueName: '그림자',
          knowledge: '모든 단서를 모아 천리마 풍영의 봉인을 해제했습니다! 절영도의 전설이 되살아났습니다.'
        }
      ],
      epilogue: { image: 'epilogue.jpg' }
    };

    // ========== 상태 관리 ==========
    let currentStep = 0;
    let currentMission = 0;
    let currentQuestion = 0;
    let collectedClues = [];

    // ========== 렌더링 함수 ==========
    function render() {
      const content = document.getElementById('content');
      const progress = document.getElementById('progress');
      const footerInventory = document.getElementById('footer-inventory');
      
      // 프롤로그
      if (currentStep === 0) {
        progress.textContent = '프롤로그';
        footerInventory.classList.add('hidden');
        content.innerHTML = `
          <div class="mb-6">
            <img src="${gameData.intro.image}" alt="프롤로그" class="story-image">
          </div>
          <button onclick="nextStep()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 rounded-lg transition shadow-lg">
            탐험 시작하기
          </button>
        `;
        return;
      }

      const mission = gameData.missions[currentMission];
      if (!mission) return;

      // 하단 인벤토리 표시
      footerInventory.classList.remove('hidden');

      // 미션 소개
      if (currentStep === 1) {
        progress.textContent = `미션 ${mission.id}`;
        content.innerHTML = `
          <div class="mb-6">
            <img src="${mission.image}" alt="미션 ${mission.id}" class="story-image">
          </div>
          <button onclick="nextStep()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 rounded-lg transition shadow-lg">
            퀴즈 시작하기
          </button>
        `;
        return;
      }

      // 퀴즈 화면
      const question = mission.questions[currentQuestion];
      if (question && currentStep === 2) {
        progress.textContent = `미션 ${mission.id} - 문제 ${currentQuestion + 1}/${mission.questions.length}`;
        
        let inputHTML = '';
        if (question.type === 'radio') {
          inputHTML = question.options.map((opt, i) => `
            <label class="flex items-center gap-3 bg-gray-200 p-4 rounded-lg border border-gray-400 hover:border-amber-500 cursor-pointer transition">
              <input type="radio" name="answer" value="${opt}" class="w-5 h-5 text-amber-600">
              <span class="text-black font-medium">${opt}</span>
            </label>
          `).join('');
        } else {
          inputHTML = `
            <input type="text" id="textAnswer" placeholder="답을 입력하세요" 
              class="w-full bg-white border border-gray-400 rounded-lg p-4 text-black font-bold focus:border-amber-500 focus:outline-none focus:ring-2 focus:ring-amber-500 shadow-inner">
            ${question.hint ? `<div class="text-xs text-gray-700 mt-2 whitespace-pre-line">${question.hint}</div>` : ''}
          `;
        }

        content.innerHTML = `
          ${question.image ? `
            <div class="mb-4">
              <img src="${question.image}" alt="참고 이미지" class="story-image border-2 border-gray-700">
            </div>
          ` : ''}
          
          ${question.q ? `
          <div class="bg-gray-300 backdrop-blur-sm rounded-xl p-6 border-b-4 border-amber-600 shadow-md">
            <div class="text-amber-700 text-lg font-bold mb-4">Q${currentQuestion + 1}.</div>
            <div class="text-gray-900 font-medium mb-6 leading-relaxed whitespace-pre-line">${question.q}</div>
            <div class="space-y-3">
              ${inputHTML}
            </div>
          </div>
          ` : `
          <div class="space-y-3">
            ${inputHTML}
          </div>
          `}
          <button onclick="checkAnswer()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 rounded-lg transition mt-6 shadow-lg">
            정답 확인
          </button>
        `;
        return;
      }

      // 미션 완료 (단서 획득 화면 업데이트)
      if (currentStep === 3) {
        progress.textContent = `미션 ${mission.id} 완료!`;
        content.innerHTML = `
          <div class="bg-gradient-to-br from-amber-900/40 to-gray-800/60 backdrop-blur-sm rounded-xl p-6 border-2 border-amber-500 shadow-[0_0_15px_rgba(245,158,11,0.3)]">
            <div class="text-center mb-6">
              <div class="text-6xl clue-badge inline-block bg-black/30 rounded-lg p-4">${mission.clueChar}</div>
              <div class="text-amber-200 text-2xl font-bold mt-4 tracking-widest">${mission.clueName}(${mission.clueChar})</div>
              <div class="text-amber-400 text-lg mt-2">단서를 획득했습니다!</div>
            </div>
          </div>
          
          <div class="bg-gray-800/80 backdrop-blur-sm rounded-xl p-6 border border-blue-500/40 mt-6 shadow-md">
            <div class="text-blue-400 font-bold mb-3 flex items-center gap-2">
              <span class="text-xl">💡</span> 함께 알아두면 좋은 해양 지식
            </div>
            <div class="text-gray-300 text-sm leading-relaxed">${mission.knowledge}</div>
          </div>

          <button onclick="nextMission()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-4 rounded-lg transition mt-6 shadow-lg">
            ${currentMission < gameData.missions.length - 1 ? '다음 미션으로 이동' : '에필로그 보기'}
          </button>
        `;
        return;
      }
    }

    // ========== 게임 로직 ==========
    function nextStep() {
      currentStep++;
      render();
    }

    function checkAnswer() {
      const mission = gameData.missions[currentMission];
      const question = mission.questions[currentQuestion];
      let userAnswer = '';

      if (question.type === 'radio') {
        const selected = document.querySelector('input[name="answer"]:checked');
        if (!selected) {
          alert('답을 선택해주세요!');
          return;
        }
        userAnswer = selected.value;
      } else {
        userAnswer = document.getElementById('textAnswer').value.trim();
        if (!userAnswer) {
          alert('답을 입력해주세요!');
          return;
        }
      }

      let isCorrect = false;
      if (Array.isArray(question.answer)) {
        isCorrect = question.answer.some(ans => userAnswer.includes(ans) || userAnswer === ans);
      } else {
        isCorrect = userAnswer === question.answer;
      }

      if (isCorrect) {
        alert('✅ 정답입니다!');
        currentQuestion++;
        
        if (currentQuestion >= mission.questions.length) {
          // 객체 형태로 단서 저장
          collectedClues.push({ char: mission.clueChar, name: mission.clueName });
          updateInventory();
          currentStep = 3;
          currentQuestion = 0;
        }
        render();
      } else {
        alert('❌ 다시 생각해보세요!');
      }
    }

    function nextMission() {
      currentMission++;
      if (currentMission >= gameData.missions.length) {
        showEpilogue();
        return;
      }
      currentStep = 1;
      render();
    }

    // ========== 통합된 에필로그 함수 ==========
    function showEpilogue() {
      const content = document.getElementById('content');
      const progress = document.getElementById('progress');
      const footerInventory = document.getElementById('footer-inventory');
      
      progress.textContent = '🎉 모든 봉인 해제 완료!';
      footerInventory.classList.add('hidden');
      
      content.innerHTML = `
        <div class="mb-6">
          <img src="${gameData.epilogue.image}" alt="에필로그" class="story-image">
        </div>
        
        <div class="bg-gradient-to-br from-amber-900/50 to-gray-800/50 backdrop-blur-sm rounded-xl p-6 border-2 border-amber-500 mb-8 shadow-lg">
          <h2 class="text-xl font-bold text-amber-400 mb-4 text-center">완성된 천리마의 봉인</h2>
          <div class="flex justify-center gap-3 flex-wrap">
            ${collectedClues.map(clue => `
              <div class="clue-badge bg-amber-900/60 border-2 border-amber-500 rounded-lg px-4 py-2 shadow-md text-center">
                <div class="text-3xl text-amber-100">${clue.char}</div>
                <div class="text-sm text-amber-300 mt-1 font-bold">${clue.name}</div>
              </div>
            `).join('')}
          </div>
        </div>

        <section class="bg-[
] rounded-2xl p-6 border border-gray-800 space-y-4 mb-8 shadow-xl">
            <div class="flex items-center space-x-2 text-[
]">
                <span class="text-sm font-bold">Ⅲ. 에필로그</span>
                <span class="text-xs text-gray-400">— 영도할매의 작별 인사 —</span>
            </div>
            
            <div class="mystic-font text-base leading-relaxed text-gray-300 space-y-4 bg-[
] p-5 rounded-xl border border-gray-800 italic">
                <p>" 자, 모든 봉인이 풀렸어. 풍영이 다시 바람이 되어 달리고 있구나. "</p>
                <p>" 오늘 너희가 발견한 것은 단순한 퀴즈의 답이 아니란다. 바로 우리 바다가 천 년 동안 품어온 이야기들이지. "</p>
                <p>" 4층에서는 바다를 건넌 조상들의 지혜와 용기를 만났고, 3층에서는 바다를 기록하고, 노래하고, 살아온 이들의 삶을 만났단다. 이 모든 것이 바로 <span class="text-[
] font-bold not-italic">'해양 문화'</span>란다. "</p>
                <p>" 기억해주렴. 그리고 다음에는 친구들에게도 이 이야기를 들려주렴. 언젠가 다시 만나자구나, 작은 탐험가들아. "</p>
                <p class="text-right text-sm text-[
] font-bold not-italic mt-4">— 영도할매가... —</p>
            </div>
        </section>

        <section class="bg-[
] rounded-2xl p-6 border border-gray-800 space-y-6 mb-8 shadow-xl">
            <div class="space-y-2">
                <label for="familyName" class="block text-sm font-medium text-gray-400">
                    인증서에 새길 <span class="text-[
]">이름</span>을 입력해 주세요:
                </label>
                <input type="text" id="familyName" placeholder="예: 홍길동 가족" 
                       class="w-full bg-[
] border border-gray-600 rounded-xl px-4 py-3 text-gray-200 focus:outline-none focus:border-[
] transition duration-200 text-sm">
            </div>

            <div class="bg-[
] text-gray-900 rounded-xl p-6 gold-border text-center space-y-6 bg-[radial-gradient(#f4f0e3_1px,transparent_1px)] [background-size:16px_16px]">
                <div class="space-y-1">
                    <p class="text-[10px] uppercase tracking-widest font-bold text-amber-800">Certificate of Maritime Explorer</p>
                    <h2 class="text-xl font-bold text-amber-950 mystic-font">영도 해양 문화 탐험가 인증서</h2>
                </div>

                <div class="mystic-font py-5 space-y-5 text-sm leading-relaxed text-stone-800 border-t border-b border-amber-200/80">
                    <p class="text-base font-bold text-amber-900">
                        이름: <span id="certName" class="border-b-2 border-amber-700 px-2 pb-1 text-lg font-black text-stone-900">[ 이름 ]</span>
                    </p>
                    <p class="text-xs text-stone-600 px-2 leading-loose">
                        위 사람은 2026년 오늘, 국립해양박물관에서 절영도의 7가지 봉인을 모두 풀고 천리마 풍영을 자유롭게 해주었음을 인증합니다.
                    </p>
                </div>

                <p class="mystic-font text-xs font-bold text-amber-900 tracking-wider">— 영도할매 드림 —</p>
            </div>
        </section>

        <section class="text-center space-y-5 pt-4 pb-8">
            <div class="space-y-2 bg-gray-900/60 p-4 rounded-xl border border-gray-800">
                <p class="text-sm text-gray-300 leading-relaxed font-medium">
                    탐험을 무사히 마치신 여러분의 생생한 피드백이 필요해요!<br>
                    <span class="text-amber-400 font-bold">문제 수, 난이도, 소요 시간</span>에 대한 의견을 들려주시면 큰 도움이 됩니다.
                </p>
            </div>

            <a href="https://docs.google.com/forms/d/e/1FAIpQLScdq_0WGOc-s7EhNzPRSNkTaL_4pdhM2HOPpWDyNHX9RGDJnw/viewform?usp=publish-editor" 
               target="_blank" 
               rel="noopener noreferrer" 
               class="block w-full text-center bg-gradient-to-r from-amber-600 to-yellow-600 hover:from-amber-500 hover:to-yellow-500 text-white font-bold py-5 px-6 rounded-xl transition duration-300 shadow-xl transform active:scale-[0.98] text-lg">
                🚀 3분 설문조사 참여하고 의견 남기기
            </a>
            
            <div class="text-xs text-gray-500 mt-6 pt-4 border-t border-gray-800">
               국립해양박물관 방문을 기념합니다 🌊
            </div>
        </section>
      `;

      setTimeout(() => {
        const nameInput = document.getElementById('familyName');
        const certName = document.getElementById('certName');
        if (nameInput && certName) {
          nameInput.addEventListener('input', (e) => {
            const value = e.target.value.trim();
            certName.textContent = value ? value : '[ 우리 가족 ]';
          });
        }
      }, 50);
    }

    function updateInventory() {
      const inventory = document.getElementById('inventory');
      if (collectedClues.length === 0) {
        inventory.innerHTML = '<div class="text-gray-500 text-sm">아직 획득한 단서가 없습니다</div>';
      } else {
        // 인벤토리에도 한자와 뜻이 같이 나오도록 수정
        inventory.innerHTML = collectedClues.map(clue => `
          <div class="clue-badge bg-amber-900/60 border-2 border-amber-500 rounded-lg px-3 py-1 shadow-sm text-center">
            <div class="text-xl text-amber-100">${clue.char}</div>
            <div class="text-[10px] text-amber-300 mt-1">${clue.name}</div>
          </div>
        `).join('');
      }
    }

    // ========== 초기화 ==========
    render();
  </script>
</body>
</html>
